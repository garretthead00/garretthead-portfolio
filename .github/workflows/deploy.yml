name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check, build and publish
    runs-on: ubuntu-latest
    permissions:
      # Write access is used only by the publish step, which runs on main.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Performance budgets
        run: npm run check:budgets

      - name: Accessibility and smoke checks (Chrome)
        run: npm run test:e2e

      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Smoke checks (Firefox and WebKit)
        run: npx playwright test --project=firefox --project=webkit

      - name: Lighthouse
        run: npm run check:lighthouse

      - name: Publish dist/ to the gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GitHub Pages serves the gh-pages branch as-is; skip Jekyll.
          touch dist/.nojekyll

          git fetch --depth=1 origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/gh-pages" origin/gh-pages
          cd "$RUNNER_TEMP/gh-pages"

          # Replace the branch contents with the new build.
          git rm -r --quiet --ignore-unmatch .
          cp -a "$GITHUB_WORKSPACE/dist/." .
          git add --all

          if git diff --cached --quiet; then
            echo "gh-pages is already up to date with ${SOURCE_SHA}."
            exit 0
          fi

          git -c user.name="Garrett Head" \
              -c user.email="garretthead@Garretts-MacBook-Pro.local" \
              commit --quiet -m "Deploy ${SOURCE_SHA::7} from main"
          git push origin HEAD:gh-pages
