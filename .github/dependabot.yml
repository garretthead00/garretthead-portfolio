# Weekly dependency updates, grouped so minor and patch bumps arrive as one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ESLint 10 waits for eslint-plugin-jsx-a11y, which supports ESLint
      # up to 9 (6.10.2). Remove this once it supports 10; upgrade eslint
      # and @eslint/js together.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
